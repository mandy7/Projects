    competitors:
      # Large-cap stock / F&O page = Reliance Industries on every site, so pages are comparable.
      - name: Groww
        cadence: biweekly
        pages:
          gift-nifty: https://groww.in/indices/global-indices/sgx-nifty
          gold-mcx: https://groww.in/commodities/mcx_gold
          silver-mcx: https://groww.in/commodities/mcx_silverm
          stock: https://groww.in/stocks/reliance-industries-ltd
          # fno: ???
          ipo: https://groww.in/ipo   # unverified guess
