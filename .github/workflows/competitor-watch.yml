name: Competitor test watch
on:
  schedule:
    - cron: "0 6 * * 1"   # every Monday; the tool itself skips pages not yet due (biweekly / monthly)
  workflow_dispatch:
    inputs:
      force:
        description: "Scrape everything now, ignoring cadence"
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  watch:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: competitor-test-scraper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt && playwright install --with-deps chromium
      - run: python -m cro_watch run ${{ inputs.force && '--force' || '' }}
      - name: Commit snapshots and report
        run: |
          git config user.name "competitor-watch"; git config user.email "noreply@users.noreply.github.com"
          git add data reports
          git diff --cached --quiet || (git commit -m "Competitor watch $(date +%F)" && git push)
